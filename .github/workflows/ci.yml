name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.x', '26.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm i -g pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # Node-version-independent checks: run once, not per matrix entry.
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
      - run: npm i -g pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm privacy-check
      - name: Publication gate
        # The gate resolves an empty, all-zero or unknown base to the full history of the head.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/publication-gate.mjs --range "$PR_BASE..$PR_HEAD"
          else
            node scripts/publication-gate.mjs --range "$BEFORE..$SHA"
          fi
      - run: pnpm build
      - run: node scripts/consumer-smoke.mjs
